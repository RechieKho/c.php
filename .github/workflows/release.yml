name: release
on:
  push:
    tags: ['v*']
jobs:
  vsix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: editor/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: editor/vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: editor/vscode/*.vsix
      - name: GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          files: editor/vscode/*.vsix
      # Publishing needs repository secrets; each step is skipped when its token is absent.
      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx vsce publish --packagePath *.vsix
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish *.vsix -p "$OVSX_PAT"
